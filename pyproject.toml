[project]
name = "goalkeeper-harness"
version = "2.2.4"
description = "A single-agent execution harness with traceable context and delivery review"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
goalkeeper = "goalkeeper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-runtime.txt"]}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
