[project]
name = "goalkeeper-simple"
version = "0.1.0"
description = "Independent minimal coding harness with verifiable delivery"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pyjwt[crypto]>=2.9,<3",
    "keyring>=25,<26",
    "tiktoken>=0.9,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[project.scripts]
goalkeeper = "goalkeeper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goalkeeper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
